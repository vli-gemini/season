<!DOCTYPE html>
<html lang="en">
<head>

<title>Dandie v2 — Brushpen + Gouache</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    min-height: 100vh;
    padding: 72px 48px 96px;
  }
  header {
    text-align: center;
    margin-bottom: 64px;
  }
  header h1 {
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #AAA;
    font-weight: 500;
    margin-bottom: 10px;
  }
  header p {
    font-size: 12px;
    color: #C0BDB8;
    font-style: italic;
  }
  .row {
    display: flex;
    justify-content: center;
    gap: 28px;
  }
  .card {
    background: #FDFAF5;
    border-radius: 32px;
    padding: 52px 32px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    box-shadow: 0 4px 48px rgba(0,0,0,0.08);
  }
  .label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #C8C4BE;
    font-weight: 600;
  }
  .day {
    font-size: 11px;
    color: #D8D4CE;
    margin-top: -22px;
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>Dandie — Brushpen &times; Gouache</h1>
  <p>Painted washes underneath &middot; ink lines on top &middot; paper texture throughout</p>
</header>

<div class="row">
